<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero MAX — Camarote Savaris</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Dancing+Script:wght@700&family=Cinzel:wght@900&family=Inter:wght@300;400;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== BACKGROUND LAYERS ===== */
.bg-stack { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

/* Real bokeh glitter image layer */
.bg-bokeh {
  position: absolute; inset: -10%;
  background-image: url('https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1200&q=80');
  background-size: cover;
  background-position: center;
  opacity: 0.35;
  filter: saturate(1.6) blur(1px);
  mix-blend-mode: screen;
  animation: bokehDrift 30s ease-in-out infinite alternate;
}
@keyframes bokehDrift {
  0% { transform: scale(1.1) translate(0,0); }
  100% { transform: scale(1.25) translate(-3%, -2%); }
}

/* Color wash gradients */
.bg-wash {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(255,51,153,0.35) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 25%, rgba(123,97,255,0.35) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, rgba(255,215,0,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 0% 80%, rgba(0,212,255,0.25) 0%, transparent 40%),
    radial-gradient(ellipse at 100% 70%, rgba(57,255,20,0.2) 0%, transparent 40%);
  animation: washPulse 8s ease-in-out infinite;
}
@keyframes washPulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* Canvas neon waves */
canvas#waves { position: absolute; inset: 0; opacity: 0.9; }
/* Canvas fireworks */
canvas#fireworks { position: absolute; inset: 0; }
/* Canvas glitter dust */
canvas#dust { position: absolute; inset: 0; }

/* Prism light streaks */
.prism { position: absolute; width: 250%; height: 3px; filter: blur(2px); opacity: 0.5; mix-blend-mode: screen; }
.prism.p1 { top: 18%; left: -75%; background: linear-gradient(90deg, transparent, #ff3399, #ffd700, transparent); transform: rotate(-18deg); animation: prismMove 12s linear infinite; }
.prism.p2 { top: 50%; left: -75%; background: linear-gradient(90deg, transparent, #00ffcc, #7b61ff, transparent); transform: rotate(-12deg); animation: prismMove 16s linear infinite reverse; }
.prism.p3 { top: 75%; left: -75%; background: linear-gradient(90deg, transparent, #ffd700, #ff6ec4, transparent); transform: rotate(-8deg); animation: prismMove 20s linear infinite; }
@keyframes prismMove {
  0% { transform: translateX(-10%) rotate(-15deg); }
  100% { transform: translateX(20%) rotate(-15deg); }
}

/* ===== HERO ===== */
.hero {
  position: relative;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 22px 48px;
  z-index: 10;
}

/* Top invite */
.top-invite { text-align: center; margin-bottom: 14px; }
.top-invite p {
  font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(255,255,255,0.65); line-height: 1.8;
  text-shadow: 0 0 10px rgba(255,255,255,0.3);
}
.top-invite .deco-line { width: 60px; height: 1px; margin: 8px auto 0; background: linear-gradient(90deg, transparent, #ffd700, transparent); }

/* ===== 40 TONS DE GLITTER (glitter texture multicolor) ===== */
.glitter-title { text-align: center; margin-bottom: 2px; line-height: 0.95; }

.gt-40 {
  font-family: 'Playfair Display', serif; font-weight: 900; font-size: 60px;
}
.gt-40 .n4 {
  background: linear-gradient(135deg, #ffd700, #ffec80, #ffaa00);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 18px rgba(255,215,0,0.9));
}
.gt-40 .n0 {
  background: linear-gradient(135deg, #ff3399, #ff80c0, #ff0066);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 18px rgba(255,51,153,0.9));
}

.glitter-text {
  position: relative;
  display: inline-flex;
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800&q=80');
  background-size: 200% 200%;
  background-position: center;
}
.glitter-letter {
  display: inline-block;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  background-blend-mode: screen;
}
/* Each TONS letter rainbow + glitter image blend */
.tons { font-size: 64px; letter-spacing: 0.03em; }
.t-T { background-image: linear-gradient(135deg, #ff1744, #ff6090), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&q=80'); background-size: cover; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter: drop-shadow(0 0 16px #ff1744); display:inline-block; }
.t-O { background-image: linear-gradient(135deg, #ff6b35, #ffaa00), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&q=80'); background-size: cover; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter: drop-shadow(0 0 16px #ff6b35); display:inline-block; }
.t-N { background-image: linear-gradient(135deg, #ffd700, #fff176), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&q=80'); background-size: cover; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter: drop-shadow(0 0 16px #ffd700); display:inline-block; }
.t-S { background-image: linear-gradient(135deg, #39ff14, #7cff5a), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&q=80'); background-size: cover; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter: drop-shadow(0 0 16px #39ff14); display:inline-block; }

.gt-de { font-family:'Playfair Display',serif; font-weight:900; font-size:18px; letter-spacing:0.5em; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:1px 0; }

.glitter-big { font-size: 78px; letter-spacing: 0.02em; line-height: 0.9; }
.g-G { background:linear-gradient(135deg,#00d4ff,#80f0ff); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #00d4ff); display:inline-block; }
.g-L { background:linear-gradient(135deg,#7b61ff,#b0a0ff); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #7b61ff); display:inline-block; }
.g-I { background:linear-gradient(135deg,#ff3399,#ff80c0); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #ff3399); display:inline-block; }
.g-T { background:linear-gradient(135deg,#ff1744,#ff6090); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #ff1744); display:inline-block; }
.g-T2 { background:linear-gradient(135deg,#ff6b35,#ffaa00); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #ff6b35); display:inline-block; }
.g-E { background:linear-gradient(135deg,#ffd700,#fff176); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #ffd700); display:inline-block; }
.g-R { background:linear-gradient(135deg,#39ff14,#7cff5a); -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px #39ff14); display:inline-block; }

/* glitter sparkle dots over the title */
.title-sparkles { position: absolute; inset: -10px; pointer-events: none; }
.tspark { position:absolute; width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff; animation: twinkle 1.8s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:0;transform:scale(0);} 50%{opacity:1;transform:scale(1);} }

/* Apresenta */
.apresenta { font-size:10px; letter-spacing:0.5em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin:14px 0 4px; display:flex; align-items:center; gap:10px; }
.apresenta::before,.apresenta::after{content:'✦';color:#ffd700;font-size:9px;text-shadow:0 0 8px #ffd700;}

/* Camarote */
.camarote { font-family:'Cinzel',serif; font-weight:900; font-size:15px; letter-spacing:0.7em; text-transform:uppercase;
  background:linear-gradient(90deg,#836D30,#C9A84C,#FFE699,#fff5cc,#C9A84C,#836D30);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; }

.crown { font-size:40px; margin:4px 0; filter:drop-shadow(0 0 18px rgba(255,215,0,1)) drop-shadow(0 0 35px rgba(255,170,0,0.7)); animation:crownGlow 2.5s ease-in-out infinite; }
@keyframes crownGlow{0%,100%{filter:drop-shadow(0 0 18px rgba(255,215,0,1)) drop-shadow(0 0 35px rgba(255,170,0,0.7));}50%{filter:drop-shadow(0 0 30px rgba(255,215,0,1)) drop-shadow(0 0 70px rgba(255,215,0,0.9)) drop-shadow(0 0 100px rgba(255,140,0,0.5));}}

/* Savaris metallic gold 3D */
.savaris {
  font-family:'Cinzel',serif; font-weight:900; font-size:74px; letter-spacing:0.1em; line-height:1;
  background:linear-gradient(135deg,#4a3208 0%,#836D30 12%,#C9A84C 26%,#FFE699 42%,#fffae0 50%,#FFE699 58%,#C9A84C 74%,#836D30 88%,#4a3208 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.9)) drop-shadow(0 0 35px rgba(201,168,76,0.7)) drop-shadow(0 0 60px rgba(255,215,0,0.3));
}

.savaris-deco{display:flex;align-items:center;gap:8px;margin:6px 0 8px;width:100%;justify-content:center;}
.savaris-deco .line{flex:1;max-width:90px;height:1px;background:linear-gradient(90deg,transparent,#C9A84C);}
.savaris-deco .line.r{background:linear-gradient(90deg,#C9A84C,transparent);}
.savaris-deco .star{color:#ffd700;font-size:11px;text-shadow:0 0 10px #ffd700;}

/* Brilhe */
.brilhe{font-family:'Dancing Script',cursive;font-size:32px;font-weight:700;
  background:linear-gradient(90deg,#ff3399,#ffd700,#00ffcc,#7b61ff,#ff3399);background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:rainbowShift 4s ease infinite;filter:drop-shadow(0 0 12px rgba(255,51,153,0.6));margin-bottom:12px;}
@keyframes rainbowShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

/* Mask — real image */
.mask-section{position:relative;width:100%;height:200px;display:flex;align-items:center;justify-content:center;margin:6px 0;}
.mask-img{height:180px;filter:drop-shadow(0 0 25px rgba(255,215,0,0.8)) drop-shadow(0 0 50px rgba(255,51,153,0.5)) drop-shadow(0 0 70px rgba(123,97,255,0.4));animation:maskFloat 3.5s ease-in-out infinite;}
@keyframes maskFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.mask-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,215,0,0.25) 0%,rgba(255,51,153,0.12) 35%,transparent 65%);}

/* Neon quote */
.neon-quote{border:2px solid rgba(255,51,153,0.6);border-radius:14px;padding:18px 26px;text-align:center;margin:10px 0;position:relative;
  box-shadow:0 0 25px rgba(255,51,153,0.3),inset 0 0 25px rgba(255,51,153,0.06);background:rgba(0,0,0,0.45);backdrop-filter:blur(12px);}
.neon-quote p{font-size:19px;line-height:1.5;color:rgba(255,255,255,0.92);font-weight:300;}
.neon-quote .hl{font-family:'Dancing Script',cursive;font-size:28px;font-weight:700;}
.neon-quote .h1{color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,0.9);}
.neon-quote .h2{color:#ff3399;text-shadow:0 0 18px rgba(255,51,153,0.9);}

/* Date */
.date-section{text-align:center;margin:14px 0;}
.date-neon{font-size:44px;font-weight:900;letter-spacing:0.08em;color:#ff3399;
  text-shadow:0 0 20px rgba(255,51,153,1),0 0 40px rgba(255,51,153,0.7),0 0 80px rgba(255,51,153,0.4);animation:neonFlicker 5s ease-in-out infinite;}
@keyframes neonFlicker{0%,90%,100%{opacity:1;}92%{opacity:0.7;}94%{opacity:1;}96%{opacity:0.85;}}
.date-sub{font-size:10px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:4px;}

/* CTA */
.cta-btn{display:inline-flex;align-items:center;gap:8px;padding:16px 38px;border-radius:50px;font-size:13px;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;color:#000;
  background:linear-gradient(90deg,#ff3399,#ff9f43,#ffd700,#00ffcc,#7b61ff,#ff3399);background-size:300% 300%;
  animation:rainbowShift 4s ease infinite;box-shadow:0 0 35px rgba(255,51,153,0.6),0 0 70px rgba(255,215,0,0.3);
  border:none;cursor:pointer;margin-top:18px;text-decoration:none;}

.bottom-bar{margin-top:22px;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,215,0,0.6);display:flex;align-items:center;gap:10px;}
.bottom-bar .dot{width:3px;height:3px;background:#ffd700;border-radius:50%;box-shadow:0 0 5px #ffd700;}
</style>
</head>
<body>

<div class="bg-stack">
  <div class="bg-bokeh"></div>
  <div class="bg-wash"></div>
  <canvas id="waves"></canvas>
  <canvas id="fireworks"></canvas>
  <canvas id="dust"></canvas>
  <div class="prism p1"></div>
  <div class="prism p2"></div>
  <div class="prism p3"></div>
</div>

<div class="hero">
  <div class="top-invite">
    <p>VOCÊ ESTÁ CONVIDADO PARA O<br>EVENTO MAIS BRILHANTE DO CARNAVAL!</p>
    <div class="deco-line"></div>
  </div>

  <div class="glitter-title">
    <div class="gt-40"><span class="n4">4</span><span class="n0">0</span></div>
    <div class="tons" style="position:relative;display:inline-block;">
      <span class="t-T" style="font-family:'Playfair Display',serif;font-weight:900;">T</span><span class="t-O" style="font-family:'Playfair Display',serif;font-weight:900;">O</span><span class="t-N" style="font-family:'Playfair Display',serif;font-weight:900;">N</span><span class="t-S" style="font-family:'Playfair Display',serif;font-weight:900;">S</span>
    </div>
    <div class="gt-de">de</div>
    <div class="glitter-big" style="position:relative;display:inline-block;">
      <span class="g-G" style="font-family:'Playfair Display',serif;font-weight:900;">G</span><span class="g-L" style="font-family:'Playfair Display',serif;font-weight:900;">L</span><span class="g-I" style="font-family:'Playfair Display',serif;font-weight:900;">I</span><span class="g-T" style="font-family:'Playfair Display',serif;font-weight:900;">T</span><span class="g-T2" style="font-family:'Playfair Display',serif;font-weight:900;">T</span><span class="g-E" style="font-family:'Playfair Display',serif;font-weight:900;">E</span><span class="g-R" style="font-family:'Playfair Display',serif;font-weight:900;">R</span>
      <div class="title-sparkles" id="titleSparkles"></div>
    </div>
  </div>

  <div class="apresenta">Apresenta</div>
  <div class="camarote">Camarote</div>
  <div class="crown">👑</div>
  <div class="savaris">SAVARIS</div>
  <div class="savaris-deco"><div class="line"></div><span class="star">★</span><div class="line r"></div></div>
  <div class="brilhe">Brilhe sem moderação.</div>

  <div class="mask-section">
    <div class="mask-glow"></div>
    <img class="mask-img" src="https://www.transparentpng.com/thumb/carnival-mask/carnival-mask-png-transparent-images-9.png" alt="máscara"
      onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div style=\'font-size:120px;filter:drop-shadow(0 0 30px rgba(255,215,0,0.9))\'>🎭</div>')">
  </div>

  <div class="neon-quote">
    <p>Porque a vida sem <span class="hl h1">brilho</span>,<br>é sem <span class="hl h2">graça.</span> ♥</p>
  </div>

  <div class="date-section">
    <div class="date-neon">08.02.2027</div>
    <div class="date-sub">— Segunda-feira —</div>
  </div>

  <a class="cta-btn" href="#">✨ Quero meu abadá</a>

  <div class="bottom-bar">
    <span>★</span><span>Exclusivo</span><div class="dot"></div><span>Inesquecível</span><div class="dot"></div><span>Premium</span><span>★</span>
  </div>
</div>

<script>
// ===== NEON WAVES =====
const wc=document.getElementById('waves'),wx=wc.getContext('2d');
let t=0;
function rs(){[wc,document.getElementById('fireworks'),document.getElementById('dust')].forEach(c=>{c.width=innerWidth;c.height=innerHeight;});}
rs();addEventListener('resize',rs);
const wcol=['rgba(255,51,153,V)','rgba(255,215,0,V)','rgba(0,212,255,V)','rgba(123,97,255,V)','rgba(57,255,20,V)','rgba(255,107,53,V)'];
function waves(){wx.clearRect(0,0,wc.width,wc.height);const h=wc.height,w=wc.width;
  wcol.forEach((ct,i)=>{const off=(i/wcol.length)*Math.PI*2,amp=45+i*16,freq=0.0028+i*0.0008,yb=h*(0.32+i*0.085);
    const a=0.32+Math.sin(t*0.5+off)*0.18;wx.beginPath();wx.strokeStyle=ct.replace('V',a.toFixed(2));wx.lineWidth=Math.max(1,2-i*0.2);
    wx.shadowBlur=18;wx.shadowColor=ct.replace('V','0.8');
    for(let x=0;x<=w;x+=3){const y=yb+Math.sin(x*freq+t+off)*amp+Math.sin(x*freq*1.7+t*0.8+off)*(amp*0.4);x===0?wx.moveTo(x,y):wx.lineTo(x,y);}
    wx.stroke();wx.shadowBlur=0;});
  t+=0.018;requestAnimationFrame(waves);}
waves();

// ===== FIREWORKS =====
const fc=document.getElementById('fireworks'),fx=fc.getContext('2d');
let parts=[];const fcol=['#ff3399','#ffd700','#00ffcc','#7b61ff','#39ff14','#ff6b35','#ff1744'];
function launch(){const cx=Math.random()*fc.width,cy=Math.random()*fc.height*0.5+fc.height*0.1;
  const col=fcol[Math.floor(Math.random()*fcol.length)],n=40+Math.random()*30;
  for(let i=0;i<n;i++){const ang=(Math.PI*2*i)/n,sp=1+Math.random()*4;
    parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col,size:1.5+Math.random()*2});}}
function fwLoop(){fx.clearRect(0,0,fc.width,fc.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.life-=0.012;
    if(p.life>0){fx.globalAlpha=p.life;fx.fillStyle=p.col;fx.shadowBlur=10;fx.shadowColor=p.col;
      fx.beginPath();fx.arc(p.x,p.y,p.size,0,Math.PI*2);fx.fill();}});
  fx.globalAlpha=1;fx.shadowBlur=0;parts=parts.filter(p=>p.life>0);requestAnimationFrame(fwLoop);}
fwLoop();setInterval(launch,900);launch();

// ===== GLITTER DUST =====
const dc=document.getElementById('dust'),dx=dc.getContext('2d');
const dust=Array.from({length:120},()=>({x:Math.random()*dc.width,y:Math.random()*dc.height,
  s:Math.random()*2+0.5,sp:Math.random()*0.5+0.1,ph:Math.random()*Math.PI*2,
  hue:Math.random()*360}));
function dustLoop(time){dx.clearRect(0,0,dc.width,dc.height);
  dust.forEach(d=>{d.y-=d.sp;if(d.y<0){d.y=dc.height;d.x=Math.random()*dc.width;}
    const tw=Math.sin(time*0.003+d.ph)*0.5+0.5;dx.globalAlpha=tw*0.8;
    dx.fillStyle=`hsl(${d.hue},90%,70%)`;dx.shadowBlur=8;dx.shadowColor=`hsl(${d.hue},90%,70%)`;
    dx.beginPath();dx.arc(d.x,d.y,d.s,0,Math.PI*2);dx.fill();});
  dx.globalAlpha=1;dx.shadowBlur=0;requestAnimationFrame(dustLoop);}
requestAnimationFrame(dustLoop);

// ===== TITLE SPARKLES =====
const ts=document.getElementById('titleSparkles');
for(let i=0;i<14;i++){const s=document.createElement('div');s.className='tspark';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s;`;ts.appendChild(s);}
</script>
</body>
</html>
