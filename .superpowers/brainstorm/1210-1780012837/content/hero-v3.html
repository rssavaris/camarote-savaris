<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero v3 — Glitter Font</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@900&family=Playfair+Display:wght@900&family=Inter:wght@300;700&display=swap');

@font-face {
  font-family: 'GlitterFont';
  src: url('GLITF___.TTF') format('truetype');
  font-weight: normal;
  font-style: normal;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

.bg-stack{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg-wash{position:absolute;inset:0;background:
  radial-gradient(ellipse at 15% 18%,rgba(255,51,153,0.35) 0%,transparent 45%),
  radial-gradient(ellipse at 85% 22%,rgba(123,97,255,0.35) 0%,transparent 45%),
  radial-gradient(ellipse at 50% 105%,rgba(255,215,0,0.28) 0%,transparent 50%),
  radial-gradient(ellipse at 0% 80%,rgba(0,212,255,0.22) 0%,transparent 40%),
  radial-gradient(ellipse at 100% 72%,rgba(57,255,20,0.18) 0%,transparent 40%);
  animation:washPulse 8s ease-in-out infinite;}
@keyframes washPulse{0%,100%{opacity:0.8;}50%{opacity:1;}}
canvas{position:absolute;inset:0;}
.prism{position:absolute;width:250%;height:3px;filter:blur(2px);opacity:0.45;mix-blend-mode:screen;}
.p1{top:18%;left:-75%;background:linear-gradient(90deg,transparent,#ff3399,#ffd700,transparent);transform:rotate(-18deg);animation:prismMove 14s linear infinite;}
.p2{top:52%;left:-75%;background:linear-gradient(90deg,transparent,#00ffcc,#7b61ff,transparent);transform:rotate(-12deg);animation:prismMove 18s linear infinite reverse;}
.p3{top:76%;left:-75%;background:linear-gradient(90deg,transparent,#ffd700,#ff3399,transparent);transform:rotate(-8deg);animation:prismMove 22s linear infinite;}
@keyframes prismMove{0%{transform:translateX(-10%) rotate(-15deg);}100%{transform:translateX(18%) rotate(-15deg);}}

.hero{position:relative;width:100%;max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 22px 48px;z-index:10;}

.top-invite{text-align:center;margin-bottom:14px;}
.top-invite p{font-size:9px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(255,255,255,0.65);line-height:1.8;}
.deco-line{width:60px;height:1px;margin:8px auto 0;background:linear-gradient(90deg,transparent,#ffd700,transparent);}

/* ==== GLITTER TITLE ==== */
.glitter-title{text-align:center;line-height:0.95;margin-bottom:4px;}

/* "40" em Playfair com cores neon */
.gt-40{font-family:'Playfair Display',serif;font-weight:900;font-size:64px;letter-spacing:-0.01em;}
.n4{color:#ffd700;text-shadow:0 0 20px #ffd700,0 0 40px rgba(255,215,0,0.6);}
.n0{color:#ff3399;text-shadow:0 0 20px #ff3399,0 0 40px rgba(255,51,153,0.6);}

/* "TONS" na fonte glitter, letras multicolor */
.gt-tons{font-family:'GlitterFont',sans-serif;font-size:72px;letter-spacing:0.06em;line-height:0.95;}

/* "de" discreto */
.gt-de{font-family:'Playfair Display',serif;font-weight:900;font-size:17px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0;}

/* "GLITTER" na fonte glitter, tamanho máximo */
.gt-glitter{font-family:'GlitterFont',sans-serif;font-size:86px;letter-spacing:0.04em;line-height:0.88;position:relative;display:inline-block;}

/* Neon colors via text-shadow — sem clip que quebra */
.lR{color:#ff1744;text-shadow:0 0 16px #ff1744,0 0 32px rgba(255,23,68,0.55);}
.lO{color:#ff6b35;text-shadow:0 0 16px #ff6b35,0 0 32px rgba(255,107,53,0.55);}
.lY{color:#ffd700;text-shadow:0 0 16px #ffd700,0 0 32px rgba(255,215,0,0.55);}
.lG{color:#39ff14;text-shadow:0 0 16px #39ff14,0 0 32px rgba(57,255,20,0.55);}
.lC{color:#00d4ff;text-shadow:0 0 16px #00d4ff,0 0 32px rgba(0,212,255,0.55);}
.lP{color:#7b61ff;text-shadow:0 0 16px #7b61ff,0 0 32px rgba(123,97,255,0.55);}
.lK{color:#ff3399;text-shadow:0 0 16px #ff3399,0 0 32px rgba(255,51,153,0.55);}

/* Sparkle dots above glitter word */
.title-sparkles{position:absolute;inset:-14px;pointer-events:none;}
.tspark{position:absolute;width:4px;height:4px;border-radius:50%;box-shadow:0 0 8px currentColor;animation:twinkle 1.8s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0);}45%,55%{opacity:1;transform:scale(1);}70%{opacity:0.3;transform:scale(0.5);}}

/* BRAND */
.apresenta{font-size:10px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin:16px 0 5px;display:flex;align-items:center;gap:10px;}
.apresenta::before,.apresenta::after{content:'✦';color:#ffd700;font-size:9px;text-shadow:0 0 8px #ffd700;}
.camarote-txt{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:0.7em;text-transform:uppercase;background:linear-gradient(90deg,#836D30,#C9A84C,#FFE699,#C9A84C,#836D30);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.crown-wrap{margin:6px 0;}
.crown-wrap svg{filter:drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 30px rgba(255,165,0,0.7));animation:crownGlow 2.5s ease-in-out infinite;}
@keyframes crownGlow{0%,100%{filter:drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 30px rgba(255,165,0,0.7));}50%{filter:drop-shadow(0 0 26px #ffd700) drop-shadow(0 0 55px rgba(255,215,0,0.9)) drop-shadow(0 0 90px rgba(255,140,0,0.4));}}
.savaris{font-family:'Cinzel',serif;font-weight:900;font-size:76px;letter-spacing:0.1em;line-height:1;background:linear-gradient(135deg,#4a3208 0%,#836D30 12%,#C9A84C 26%,#FFE699 42%,#fffae0 50%,#FFE699 58%,#C9A84C 74%,#836D30 88%,#4a3208 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.9)) drop-shadow(0 0 35px rgba(201,168,76,0.7));}
.savaris-deco{display:flex;align-items:center;gap:8px;margin:6px 0 8px;width:100%;justify-content:center;}
.savaris-deco .line{flex:1;max-width:90px;height:1px;}
.savaris-deco .ln{background:linear-gradient(90deg,transparent,#C9A84C);}
.savaris-deco .lr{background:linear-gradient(90deg,#C9A84C,transparent);}
.savaris-deco .star{color:#ffd700;font-size:11px;text-shadow:0 0 10px #ffd700;}
.brilhe{font-family:'Dancing Script',cursive;font-size:34px;font-weight:700;background:linear-gradient(90deg,#ff3399,#ffd700,#00ffcc,#7b61ff,#ff3399);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowShift 4s ease infinite;margin-bottom:8px;}
@keyframes rainbowShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

/* MASK */
.mask-section{position:relative;width:100%;height:200px;display:flex;align-items:center;justify-content:center;margin:4px 0;}
.mask-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,215,0,0.22) 0%,rgba(255,51,153,0.1) 35%,transparent 65%);}
.mask-wrap{filter:drop-shadow(0 0 22px rgba(255,215,0,0.7)) drop-shadow(0 0 44px rgba(255,51,153,0.45));animation:maskFloat 4s ease-in-out infinite;}
@keyframes maskFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}

/* QUOTE */
.neon-quote{border:2px solid rgba(255,51,153,0.6);border-radius:14px;padding:18px 26px;text-align:center;margin:10px 0;box-shadow:0 0 25px rgba(255,51,153,0.3),inset 0 0 25px rgba(255,51,153,0.06);background:rgba(0,0,0,0.45);backdrop-filter:blur(12px);}
.neon-quote p{font-size:19px;line-height:1.5;color:rgba(255,255,255,0.92);font-weight:300;}
.neon-quote .hl{font-family:'Dancing Script',cursive;font-size:28px;font-weight:700;}
.neon-quote .h1{color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,0.9);}
.neon-quote .h2{color:#ff3399;text-shadow:0 0 18px rgba(255,51,153,0.9);}

/* DATE */
.date-neon{font-size:46px;font-weight:900;letter-spacing:0.08em;color:#ff3399;text-shadow:0 0 20px rgba(255,51,153,1),0 0 40px rgba(255,51,153,0.7),0 0 80px rgba(255,51,153,0.3);animation:neonFlicker 5s ease-in-out infinite;text-align:center;margin:14px 0 0;}
@keyframes neonFlicker{0%,90%,100%{opacity:1;}92%{opacity:0.7;}94%{opacity:1;}96%{opacity:0.85;}}
.date-sub{font-size:10px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:4px;text-align:center;}

/* CTA */
.cta-btn{display:inline-flex;align-items:center;gap:8px;padding:16px 38px;border-radius:50px;font-size:13px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#000;background:linear-gradient(90deg,#ff3399,#ff9f43,#ffd700,#00ffcc,#7b61ff,#ff3399);background-size:300% 300%;animation:rainbowShift 4s ease infinite;box-shadow:0 0 35px rgba(255,51,153,0.6),0 0 70px rgba(255,215,0,0.3);border:none;cursor:pointer;margin-top:18px;text-decoration:none;}
.bottom-bar{margin-top:22px;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,215,0,0.6);display:flex;align-items:center;gap:10px;}
.bottom-bar .dot{width:3px;height:3px;background:#ffd700;border-radius:50%;box-shadow:0 0 5px #ffd700;}
</style>
</head>
<body>
<div class="bg-stack">
  <div class="bg-wash"></div>
  <canvas id="waves"></canvas><canvas id="fw"></canvas><canvas id="dust"></canvas>
  <div class="prism p1"></div><div class="prism p2"></div><div class="prism p3"></div>
</div>

<div class="hero">
  <div class="top-invite">
    <p>VOCÊ ESTÁ CONVIDADO PARA O<br>EVENTO MAIS BRILHANTE DO CARNAVAL!</p>
    <div class="deco-line"></div>
  </div>

  <!-- 40 TONS DE GLITTER com GlitterFont -->
  <div class="glitter-title">
    <div class="gt-40"><span class="n4">4</span><span class="n0">0</span></div>
    <div class="gt-tons">
      <span class="lR">T</span><span class="lO">O</span><span class="lY">N</span><span class="lG">S</span>
    </div>
    <div class="gt-de">de</div>
    <div class="gt-glitter">
      <span class="lC">G</span><span class="lP">L</span><span class="lK">I</span><span class="lR">T</span><span class="lO">T</span><span class="lY">E</span><span class="lG">R</span>
      <div class="title-sparkles" id="ts"></div>
    </div>
  </div>

  <div class="apresenta">Apresenta</div>
  <div class="camarote-txt">Camarote</div>

  <div class="crown-wrap">
    <svg width="72" height="48" viewBox="0 0 72 48">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff5cc"/><stop offset="35%" stop-color="#FFE699"/>
          <stop offset="70%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#836D30"/>
        </linearGradient>
      </defs>
      <path d="M8 42 L5 16 L22 28 L36 4 L50 28 L67 16 L64 42 Z" fill="url(#cg)" stroke="#fff5cc" stroke-width="0.8"/>
      <path d="M12 42 L10 22 L24 32 L36 10 L48 32 L62 22 L60 42 Z" fill="rgba(255,255,255,0.07)"/>
      <circle cx="5" cy="15" r="3.5" fill="#FFE699"/><circle cx="36" cy="4" r="4" fill="#fff5cc"/><circle cx="67" cy="15" r="3.5" fill="#FFE699"/>
      <circle cx="21" cy="38" r="2.5" fill="#ff3399"/><circle cx="36" cy="38" r="3" fill="#00d4ff"/><circle cx="51" cy="38" r="2.5" fill="#7b61ff"/>
    </svg>
  </div>

  <div class="savaris">SAVARIS</div>
  <div class="savaris-deco"><div class="line ln"></div><span class="star">★</span><div class="line lr"></div></div>
  <div class="brilhe">Brilhe sem moderação.</div>

  <div class="mask-section">
    <div class="mask-glow"></div>
    <svg class="mask-wrap" width="300" height="190" viewBox="0 0 300 190">
      <defs>
        <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFE699"/><stop offset="40%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#836D30"/>
        </linearGradient>
        <radialGradient id="gr" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ff3399"/></radialGradient>
        <radialGradient id="gb" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#00d4ff"/></radialGradient>
        <radialGradient id="gy" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ffd700"/></radialGradient>
      </defs>
      <g opacity="0.95">
        <path d="M85 105 Q45 70 55 25 Q65 55 90 100" fill="#ff3399"/>
        <path d="M85 105 Q50 72 58 28" stroke="#ff80c0" stroke-width="1.2" fill="none"/>
        <path d="M100 95 Q70 52 80 8 Q90 42 105 90" fill="#7b61ff"/>
        <path d="M100 95 Q72 54 82 10" stroke="#b0a0ff" stroke-width="1.2" fill="none"/>
        <path d="M118 85 Q102 42 112 0 Q120 35 122 82" fill="#00d4ff"/>
        <path d="M118 85 Q104 44 114 2" stroke="#80f0ff" stroke-width="1.2" fill="none"/>
      </g>
      <g opacity="0.95">
        <path d="M182 85 Q198 42 188 0 Q180 35 178 82" fill="#39ff14"/>
        <path d="M182 85 Q196 44 186 2" stroke="#90ff80" stroke-width="1.2" fill="none"/>
        <path d="M200 95 Q230 52 220 8 Q210 42 195 90" fill="#ff6b35"/>
        <path d="M200 95 Q228 54 218 10" stroke="#ffaa00" stroke-width="1.2" fill="none"/>
        <path d="M215 105 Q255 70 245 25 Q235 55 210 100" fill="#ffd700"/>
        <path d="M215 105 Q250 72 242 28" stroke="#fff176" stroke-width="1.2" fill="none"/>
      </g>
      <path d="M150 92 Q132 45 150 -5 Q168 45 150 92" fill="url(#mg)"/>
      <path d="M45 108 Q45 72 92 74 Q128 76 150 100 Q172 76 208 74 Q255 72 255 108 Q255 150 208 148 Q162 146 150 118 Q138 146 92 148 Q45 150 45 108 Z" fill="url(#mg)" stroke="#fff5cc" stroke-width="1.5"/>
      <path d="M55 108 Q55 82 95 84 Q130 86 150 104 Q170 86 205 84 Q245 82 245 108 Q245 130 205 132 Q168 134 150 112 Q132 134 95 132 Q55 130 55 108 Z" fill="rgba(255,255,255,0.06)"/>
      <ellipse cx="92" cy="108" rx="26" ry="17" fill="#0a0505"/>
      <ellipse cx="208" cy="108" rx="26" ry="17" fill="#0a0505"/>
      <ellipse cx="82" cy="102" rx="6" ry="4" fill="rgba(255,255,255,0.08)"/>
      <ellipse cx="198" cy="102" rx="6" ry="4" fill="rgba(255,255,255,0.08)"/>
      <circle cx="58" cy="103" r="5" fill="url(#gr)"/><circle cx="70" cy="88" r="3.5" fill="url(#gb)"/>
      <circle cx="126" cy="82" r="4" fill="url(#gy)"/><circle cx="174" cy="82" r="4" fill="url(#gb)"/>
      <circle cx="230" cy="88" r="3.5" fill="url(#gr)"/><circle cx="242" cy="103" r="5" fill="url(#gy)"/>
      <circle cx="150" cy="130" r="5.5" fill="url(#gr)"/>
      <path d="M95 148 Q80 165 60 170" stroke="#C9A84C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M205 148 Q220 165 240 170" stroke="#C9A84C" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="neon-quote">
    <p>Porque a vida sem <span class="hl h1">brilho</span>,<br>é sem <span class="hl h2">graça.</span> ♥</p>
  </div>

  <div class="date-neon">08.02.2027</div>
  <div class="date-sub">— Segunda-feira —</div>

  <a class="cta-btn" href="#">✨ Quero meu abadá</a>
  <div class="bottom-bar">
    <span>★</span><span>Exclusivo</span><div class="dot"></div><span>Inesquecível</span><div class="dot"></div><span>Premium</span><span>★</span>
  </div>
</div>

<script>
const [wc,fc,dc]=['waves','fw','dust'].map(id=>document.getElementById(id));
const [wx,fx,dx]=[wc,fc,dc].map(c=>c.getContext('2d'));
function resize(){[wc,fc,dc].forEach(c=>{c.width=innerWidth;c.height=innerHeight;});}
resize();addEventListener('resize',resize);

let t=0;
const wcols=['rgba(255,51,153,A)','rgba(255,215,0,A)','rgba(0,212,255,A)','rgba(123,97,255,A)','rgba(57,255,20,A)','rgba(255,107,53,A)'];
function waves(){
  wx.clearRect(0,0,wc.width,wc.height);
  wcols.forEach((ct,i)=>{
    const off=(i/wcols.length)*Math.PI*2,amp=42+i*14,freq=0.003+i*0.0007,yb=wc.height*(0.3+i*0.09);
    const a=(0.28+Math.sin(t*0.5+off)*0.15).toFixed(2);
    wx.beginPath();wx.strokeStyle=ct.replace('A',a);wx.lineWidth=Math.max(1,2.2-i*0.25);
    wx.shadowBlur=20;wx.shadowColor=ct.replace('A','0.8');
    for(let x=0;x<=wc.width;x+=4){const y=yb+Math.sin(x*freq+t+off)*amp+Math.sin(x*freq*1.8+t*0.75+off)*(amp*0.38);x===0?wx.moveTo(x,y):wx.lineTo(x,y);}
    wx.stroke();wx.shadowBlur=0;
  });
  t+=0.018;requestAnimationFrame(waves);
}
waves();

let parts=[];
const fcols=['#ff3399','#ffd700','#00ffcc','#7b61ff','#39ff14','#ff6b35','#ff1744'];
function launch(){
  const cx=Math.random()*fc.width,cy=Math.random()*fc.height*0.5;
  const col=fcols[Math.floor(Math.random()*fcols.length)];
  for(let i=0;i<45;i++){const ang=(Math.PI*2*i)/45,sp=1+Math.random()*4.5;parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,col,size:1.5+Math.random()*2});}
}
function fwDraw(){
  fx.clearRect(0,0,fc.width,fc.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.028;p.life-=0.011;
    if(p.life>0){fx.globalAlpha=p.life;fx.fillStyle=p.col;fx.shadowBlur=10;fx.shadowColor=p.col;fx.beginPath();fx.arc(p.x,p.y,p.size,0,Math.PI*2);fx.fill();}});
  fx.globalAlpha=1;fx.shadowBlur=0;parts=parts.filter(p=>p.life>0);requestAnimationFrame(fwDraw);
}
fwDraw();setInterval(launch,900);launch();launch();

const dustP=Array.from({length:130},()=>({x:Math.random()*dc.width,y:Math.random()*dc.height,s:Math.random()*2.2+0.4,sp:Math.random()*0.55+0.1,ph:Math.random()*Math.PI*2,hue:Math.random()*360,drift:(Math.random()-0.5)*0.3}));
function dustDraw(ts){
  dx.clearRect(0,0,dc.width,dc.height);
  dustP.forEach(d=>{d.y-=d.sp;d.x+=d.drift;if(d.y<-5){d.y=dc.height+5;d.x=Math.random()*dc.width;}
    const a=(Math.sin(ts*0.003+d.ph)*0.5+0.5)*0.75;
    dx.globalAlpha=a;dx.fillStyle=`hsl(${d.hue},95%,72%)`;dx.shadowBlur=8;dx.shadowColor=`hsl(${d.hue},95%,72%)`;
    dx.beginPath();dx.arc(d.x,d.y,d.s,0,Math.PI*2);dx.fill();});
  dx.globalAlpha=1;dx.shadowBlur=0;requestAnimationFrame(dustDraw);
}
requestAnimationFrame(dustDraw);

const tsEl=document.getElementById('ts');
const cols=['#ff3399','#ffd700','#00d4ff','#7b61ff','#39ff14','#ff6b35','#fff'];
[[5,10],[25,5],[50,8],[75,5],[95,12],[10,90],[30,85],[55,92],[80,88],[95,80],[2,50],[98,45],[18,50],[82,55],[45,2]].forEach(([l,tp],i)=>{
  const s=document.createElement('div');s.className='tspark';
  const c=cols[i%cols.length];
  s.style.cssText=`left:${l}%;top:${tp}%;animation-delay:${(i*0.27)%2}s;color:${c};background:${c};box-shadow:0 0 8px ${c}`;
  tsEl.appendChild(s);
});
</script>
</body>
</html>
